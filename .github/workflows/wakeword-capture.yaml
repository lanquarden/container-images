name: wakeword-capture

# Builds the rolling mic-buffer image consumed by lanquarden/home-ops
# hosts/smartdash/ (the smartdash wall kiosk, a Raspberry Pi 4 -> arm64).
# Multi-arch. Pull requests build (no push); only master pushes publish.
on:
  push:
    branches: [master]
    paths:
      - "wakeword-capture/**"
      - ".github/workflows/wakeword-capture.yaml"
  pull_request:
    paths:
      - "wakeword-capture/**"
      - ".github/workflows/wakeword-capture.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: vars
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: wakeword-capture/
          # smartdash is a Pi 4 (arm64); keep amd64 for local testing on beast.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/wakeword-capture:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/wakeword-capture:sha-${{ steps.vars.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
