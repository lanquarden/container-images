name: crispasr

# Builds the CrispASR ASR/TTS image consumed by lanquarden/home-ops
# hosts/beast/crispasr/. Pull requests build (no push) so the image is validated
# before merge; only master pushes publish.
on:
  push:
    branches: [master]
    paths:
      - "crispasr/**"
      - ".github/workflows/crispasr.yaml"
  pull_request:
    paths:
      - "crispasr/**"
      - ".github/workflows/crispasr.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract CrispASR version from Dockerfile
        id: tag
        run: |
          TAG=$(sed -n 's/^ARG CRISPASR_VERSION=\(.*\)/\1/p' crispasr/Dockerfile)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: crispasr/
          # The Vulkan release tarball is linux-x86_64 only.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/crispasr:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/crispasr:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
