name: oww-training

# Builds the openWakeWord "Manolo" Spanish training environment consumed by
# lanquarden/home-ops hosts/beast/oww-training/. amd64-only: the pinned wheels
# have no arm64 build. Pull requests build (no push); only master pushes publish.
on:
  push:
    branches: [master]
    paths:
      - "oww-training/**"
      - ".github/workflows/oww-training.yaml"
  pull_request:
    paths:
      - "oww-training/**"
      - ".github/workflows/oww-training.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk space
        # torch + tensorflow + speechbrain is a large dependency set; reclaim
        # the preinstalled toolchains we do not use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: vars
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: oww-training/
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/oww-training:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/oww-training:sha-${{ steps.vars.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
