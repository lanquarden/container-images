name: openclaw

on:
  push:
    branches: [main]
    paths:
      - "openclaw/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract upstream tag from Dockerfile
        id: tag
        run: |
          TAG=$(grep '^FROM ghcr.io/openclaw/openclaw:' openclaw/Dockerfile | cut -d: -f2 | cut -d@ -f1)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: openclaw/
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/openclaw:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/openclaw:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
