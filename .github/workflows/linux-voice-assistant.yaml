name: linux-voice-assistant

# Builds the smartdash LVA image consumed by lanquarden/home-ops
# hosts/smartdash/. The source lives in the fork below (issue #356 bounded
# speech gain + external duck leases on top of the pinned v1.1.15 release);
# this repository only builds and publishes it, exactly like the other images.
# Pull requests build (no push); only master pushes publish.
#
# To adopt a new revision: bump LVA_REF to the merge commit on the fork
# branch, push, and let the workflow publish the new sha-<rev> tag.
on:
  push:
    branches: [master]
    paths:
      - "linux-voice-assistant/**"
      - ".github/workflows/linux-voice-assistant.yaml"
  pull_request:
    paths:
      - "linux-voice-assistant/**"
      - ".github/workflows/linux-voice-assistant.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Issue #356 LVA fork + pinned commit (branch feat/356-bounded-speech-external-duck).
  LVA_REPOSITORY: manolo-mistalibio/linux-voice-assistant
  LVA_REF: bb5023761d732ac02de8f38bc237276d746d4ac5
  LVA_VERSION: 1.1.15-356.1

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The container-images checkout is not needed for the build; check out
      # the LVA source itself so the upstream Dockerfile and script/setup run
      # unmodified from the pinned commit.
      - name: Check out LVA source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LVA_REPOSITORY }}
          ref: ${{ env.LVA_REF }}

      - name: Short SHA
        id: vars
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # smartdash is a Pi 4 (arm64); keep amd64 for local testing on beast.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/linux-voice-assistant:${{ env.LVA_VERSION }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/linux-voice-assistant:sha-${{ steps.vars.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
